[project]
name = "degelmann-deltarecon"
version = "0.1.0"
description = "Degelmann DeltaRecon: release-deviation analysis for a Life valuation chain on an open reference model"
readme = "README.md"
license = "Apache-2.0"
requires-python = "==3.14.9"
dependencies = [
    "jsonschema>=4.26.0",
    "modelx>=0.33.0",
    "numpy>=2",
    "pandas>=3.0.6",
    "referencing>=0.37.0",
]

[project.scripts]
deltarecon = "degelmann.deltarecon.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
python-preference = "only-managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["degelmann"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
